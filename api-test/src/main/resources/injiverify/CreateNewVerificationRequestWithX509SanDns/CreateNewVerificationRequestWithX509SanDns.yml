    uniqueIdentifier: TC_InjiVerify_X509SanDns_01
    role: noauth
    restMethod: post
    checkOnlyStatusCodeInResponse: true
    inputTemplate: injiverify/CreateNewVerificationRequest/CreateNewVerificationRequest
    outputTemplate: injiverify/responseCode
    input: '{
      "clientId": "x509_san_dns:test.example.com",
      "nonce": "NkdHJkBIbdOdQaAjWm8gpA",
      "acceptVPWithoutHolderProof": false,
      "responseCodeValidationRequired": false
    }'
    output: '{
      "responseCode": "201"
    }'

