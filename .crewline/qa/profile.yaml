# Validator profile for inji-verify/api-test. Generated by `crewline discover`; ID-capture rules added by hand; reviewed by the module owner.
# Every rule is derived from the repository.
# Observed at inji/inji-verify upstream/develop a4601a1a (2026-11-02); apitest-commons 1.5.0 (api-test/pom.xml:97-98).
module_code: INJIVERIFY
resources_root: src/main/resources
suite_files: [testNgXmlFiles/injiverifySuite.xml]     # the only suite with ymlFile tests (Master suite includes it)
exclude_dirs: [config, dbFiles]
ignore_yaml: []                                       # 77/77 YAML files are wired

testcase_rules:
  # Two case families: Injiverify_ (278/354) and DC_ (74/354, the DC API cases under injiverify/DCAPI/).
  # 2 cases use 'InjiVerify_' (different casing): recorded as baseline debt KI-IV-001, not accepted as a convention.
  case_name_prefix: [Injiverify_, DC_]
  # 354/354 identifiers match; subjects contain underscores (e.g. TC_InjiVerify_VcRevocationStatus_WithProof_01).
  unique_identifier_pattern: '^TC_(?i:InjiVerify)_[A-Za-z0-9_]+_\d+$'
  # Module script class stores requestId/transactionId for EVERY case it runs, with no `_sid` check
  # (SimplePostForAutoGenIdWithHeaders.java:267-299; commons 1.5.0 writeAutoGeneratedId has no _sid gate).
  extra_id_fields_by_class:
    SimplePostForAutoGenIdWithHeaders: [requestId, transactionId]
  capture_without_sid: [SimplePostForAutoGenIdWithHeaders]
  severity:
    NAME-003: WARN                                    # style only: 117 subjects differ from the YAML root key (KI-IV-002)
