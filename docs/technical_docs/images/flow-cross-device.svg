<text x="200" y="287" text-anchor="middle" font-size="11" fill="#111">GET /vp-request/{requestId}/status</text>
<text x="200" y="308" text-anchor="middle" font-size="10" fill="#555" font-style="italic">(long-poll, ~55 s timeout)</text>
