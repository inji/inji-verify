<text x="400" y="266" text-anchor="middle" font-size="11" fill="#111">{ requestId,</text>
<text x="400" y="280" text-anchor="middle" font-size="11" fill="#111">authorizationDetails } + Set-</text>
<text x="400" y="294" text-anchor="middle" font-size="11" fill="#111">Cookie</text>
