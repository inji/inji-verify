<text x="610" y="400" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-submission/direct-</text>
<text x="610" y="414" text-anchor="middle" font-size="11" fill="#111">post</text>
<line x1="505" y1="474" x2="714" y2="474" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="610" y="456" text-anchor="middle" font-size="11" fill="#111">200 { redirect_uri:</text>
<text x="610" y="470" text-anchor="middle" font-size="11" fill="#111">&#x27;...#response_code=abc&#x27; }</text>
<line x1="715" y1="530" x2="296" y2="530" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
