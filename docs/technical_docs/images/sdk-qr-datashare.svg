<text x="505" y="526" text-anchor="middle" font-size="11" fill="#111">#response_code=abc</text>
<line x1="295" y1="578" x2="504" y2="578" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="400" y="574" text-anchor="middle" font-size="11" fill="#111">POST /vp-session-results</text>
<text x="400" y="593" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Cookie + responseCode</text>
<line x1="505" y1="634" x2="296" y2="634" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
