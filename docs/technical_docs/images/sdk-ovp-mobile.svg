<line x1="715" y1="412" x2="506" y2="412" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="610" y="394" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-submission/direct-</text>
<text x="610" y="408" text-anchor="middle" font-size="11" fill="#111">post</text>
<line x1="505" y1="460" x2="714" y2="460" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="610" y="456" text-anchor="middle" font-size="11" fill="#111">200 OK</text>
<rect x="235" y="511" width="160" height="26" rx="4" fill="#fffde7" stroke="#f9a825" stroke-width="1"/>
<text x="315" y="525" text-anchor="middle" font-size="11" fill="#555" font-style="italic">visibilitychange — user returns to browser</text>
<line x1="295" y1="560" x2="504" y2="560" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="400" y="542" text-anchor="middle" font-size="11" fill="#111">GET /vp-</text>
<text x="400" y="556" text-anchor="middle" font-size="11" fill="#111">request/{requestId}/status</text>
<line x1="505" y1="608" x2="296" y2="608" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="400" y="604" text-anchor="middle" font-size="11" fill="#111">status: VP_SUBMITTED</text>
<line x1="295" y1="662" x2="504" y2="662" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="400" y="658" text-anchor="middle" font-size="11" fill="#111">POST /vp-session-results</text>
<text x="400" y="677" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Cookie: transaction_id</text>
<line x1="505" y1="718" x2="296" y2="718" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="400" y="714" text-anchor="middle" font-size="11" fill="#111">Verification result</text>
<line x1="295" y1="772" x2="86" y2="772" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="190" y="768" text-anchor="middle" font-size="11" fill="#111">onVPProcessed(results)</text>
</svg>