<text x="190" y="96" text-anchor="middle" font-size="11" fill="#111">&lt;OpenID4VPVerification</text>
<text x="190" y="110" text-anchor="middle" font-size="11" fill="#111">isSameDeviceFlowEnabled={true}</text>
<text x="190" y="124" text-anchor="middle" font-size="11" fill="#111">/&gt;</text>
<line x1="295" y1="184" x2="504" y2="184" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="400" y="180" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-session-request</text>
<line x1="505" y1="254" x2="296" y2="254" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="400" y="222" text-anchor="middle" font-size="11" fill="#111">201 { requestId,</text>
<text x="400" y="236" text-anchor="middle" font-size="11" fill="#111">authorizationDetails } + Set-</text>
<text x="400" y="250" text-anchor="middle" font-size="11" fill="#111">Cookie</text>
<line x1="295" y1="318" x2="714" y2="318" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="505" y="300" text-anchor="middle" font-size="11" fill="#111">Redirect</text>
<text x="505" y="314" text-anchor="middle" font-size="11" fill="#111">openid4vp://authorize?{params}</text>
