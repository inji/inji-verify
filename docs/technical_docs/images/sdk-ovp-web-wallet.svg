<text x="715" y="708" text-anchor="middle" font-weight="bold" fill="#1a3c6e" font-size="12">Web Wallet</text>
<line x1="85" y1="120" x2="294" y2="120" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="190" y="102" text-anchor="middle" font-size="11" fill="#111">&lt;OpenID4VPVerification</text>
<text x="190" y="116" text-anchor="middle" font-size="11" fill="#111">webWalletBaseUrl=&#x27;...&#x27; /&gt;</text>
<line x1="295" y1="168" x2="504" y2="168" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="400" y="164" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-session-request</text>
<text x="400" y="183" text-anchor="middle" font-size="10" fill="#555" font-style="italic">responseCodeValidationRequired: true</text>
<line x1="505" y1="240" x2="296" y2="240" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="400" y="208" text-anchor="middle" font-size="11" fill="#111">201 { requestId,</text>
<text x="400" y="222" text-anchor="middle" font-size="11" fill="#111">authorizationDetails } + Set-</text>
<text x="400" y="236" text-anchor="middle" font-size="11" fill="#111">Cookie</text>
<line x1="295" y1="304" x2="714" y2="304" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="505" y="286" text-anchor="middle" font-size="11" fill="#111">Redirect {webWalletBaseUrl}/auth</text>
<text x="505" y="300" text-anchor="middle" font-size="11" fill="#111">orize?{params}</text>
<line x1="715" y1="360" x2="506" y2="360" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="610" y="342" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-submission/direct-</text>
<text x="610" y="356" text-anchor="middle" font-size="11" fill="#111">post</text>
<line x1="505" y1="416" x2="714" y2="416" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="610" y="398" text-anchor="middle" font-size="11" fill="#111">200 { redirect_uri:</text>
<text x="610" y="412" text-anchor="middle" font-size="11" fill="#111">&#x27;...#response_code=abc&#x27; }</text>
<line x1="715" y1="472" x2="296" y2="472" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="505" y="454" text-anchor="middle" font-size="11" fill="#111">Redirect back with</text>
<text x="505" y="468" text-anchor="middle" font-size="11" fill="#111">#response_code=abc</text>
<line x1="295" y1="520" x2="504" y2="520" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="400" y="516" text-anchor="middle" font-size="11" fill="#111">POST /vp-session-results</text>
<text x="400" y="535" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Cookie: transaction_id  +  { responseCode: &#x27;abc&#x27; }</text>
<line x1="505" y1="576" x2="296" y2="576" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="400" y="572" text-anchor="middle" font-size="11" fill="#111">Verification result</text>
<line x1="295" y1="630" x2="86" y2="630" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="190" y="626" text-anchor="middle" font-size="11" fill="#111">onVPProcessed(results)</text>
</svg>