<line x1="530" y1="446" x2="311" y2="446" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="420" y="441" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-submission/direct-post</text>
<text x="420" y="462" text-anchor="middle" font-size="10" fill="#555" font-style="italic">{ vp_token, state }</text>
<line x1="310" y1="502" x2="529" y2="502" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="420" y="497" text-anchor="middle" font-size="11" fill="#111">200 { redirect_uri:</text>
<text x="420" y="518" text-anchor="middle" font-size="10" fill="#555" font-style="italic">&quot;https://verifier.example.com/#response_code=abc&quot; }</text>
<line x1="530" y1="550" x2="91" y2="550" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="310" y="545" text-anchor="middle" font-size="11" fill="#111">Redirect back  #response_code=abc</text>
<line x1="90" y1="614" x2="309" y2="614" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="200" y="609" text-anchor="middle" font-size="11" fill="#111">POST /vp-session-results</text>
<text x="200" y="630" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Cookie: transaction_id  +  { responseCode: &#x27;abc&#x27; }</text>
<line x1="310" y1="662" x2="91" y2="662" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
