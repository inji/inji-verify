<text x="200" y="119" text-anchor="middle" font-size="11" fill="#111">POST /v2/vp-session-request</text>
<text x="200" y="140" text-anchor="middle" font-size="10" fill="#555" font-style="italic">{ dcql_query, clientId, responseCodeValidationRequired: true }</text>
<line x1="310" y1="188" x2="91" y2="188" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
<text x="200" y="168" text-anchor="middle" font-size="11" fill="#111">201 { transactionId, requestId,</text>
<text x="200" y="183" text-anchor="middle" font-size="11" fill="#111">authorizationDetails }</text>
<text x="200" y="204" text-anchor="middle" font-size="10" fill="#555" font-style="italic">+ Set-Cookie: transaction_id</text>
<line x1="90" y1="252" x2="529" y2="252" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="310" y="232" text-anchor="middle" font-size="11" fill="#111">Redirect  {webWalletBaseUrl}/autho</text>
<text x="310" y="247" text-anchor="middle" font-size="11" fill="#111">rize?{params}</text>
<line x1="530" y1="326" x2="311" y2="326" stroke="#333" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="420" y="321" text-anchor="middle" font-size="11" fill="#111">GET /v2/vp-request/{requestId}</text>
<line x1="310" y1="382" x2="529" y2="382" stroke="#333" stroke-width="1.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
